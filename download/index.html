<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다운로드 시작 — Nooki</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --ground: #ece7db; --surface: #ffffff; --ink: #23281d; --ink-soft: #636655; --accent: #46592f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #1e231a; --surface: #272d21; --ink: #f2ece0; --ink-soft: #a8ad99; --accent: #a9c07e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--ground); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 360px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 20px; border-radius: 50%;
    border: 3px solid rgba(70,89,47,0.18); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @media (prefers-color-scheme: dark) { .spinner { border-color: rgba(169,192,126,0.22); border-top-color: var(--accent); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.5; }
  a.manual {
    display: inline-block; background: var(--surface); color: var(--ink); text-decoration: none;
    font-size: 13px; font-weight: 600; padding: 10px 20px; border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .other { display: block; margin-top: 14px; font-size: 12px; color: var(--ink-soft); }
  .other a { color: inherit; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <h1 id="msg">다운로드가 곧 시작됩니다</h1>
    <p id="sub">자동으로 안 받아지면 아래 버튼을 눌러주세요.</p>
    <a class="manual" id="manual" href="Nooki-Setup.exe">직접 다운로드</a>
    <span class="other" id="other"><a href="Nooki-mac.dmg">Mac(애플 실리콘 M1 이상)용 받기</a></span>
  </div>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "913c32726214432d9b38b9e84416fe3b"}'></script>
  <script>
    // 맥이면 dmg, 아니면 exe. 아이패드 사파리도 「Macintosh」라고 자기소개를 해서 터치 여부로 거른다.
    // 인텔 맥은 브라우저에서 가려낼 수 없어(둘 다 「Intel Mac」으로 찍힌다) 안내 문구로만 알린다.
    var isMac = /Macintosh|Mac OS X/.test(navigator.userAgent) && !(navigator.maxTouchPoints > 1);
    var file = isMac ? 'Nooki-mac.dmg' : 'Nooki-Setup.exe';
    document.getElementById('manual').href = file;
    document.getElementById('other').innerHTML = isMac
      ? 'Mac 은 애플 실리콘(M1 이상) 전용이에요. <a href="Nooki-Setup.exe">Windows 용 받기</a>'
      : '<a href="Nooki-mac.dmg">Mac(애플 실리콘 M1 이상)용 받기</a>';
    setTimeout(function () {
      window.location.href = file;
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').textContent = '다운로드가 시작됐어요!';
      document.getElementById('sub').textContent = '이 창은 곧 자동으로 닫혀요. 안 닫히면 직접 닫으셔도 됩니다.';
      // 맥은 창을 남겨둔다 — 「M1 이상 전용」 안내를 인텔 맥 사용자가 읽어야 한다
      if (!isMac) setTimeout(function () { window.close(); }, 700);
      else document.getElementById('sub').textContent = '받은 파일을 열고 Nooki 를 응용 프로그램 폴더로 끌어다 놓으세요.';
    }, 400);
  </script>
</body>
</html>
